
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateZ(0); /* Hardware acceleration to prevent Android webview glitching */
        }
        .weather-gradient-sunny {
            background: linear-gradient(to bottom right, #38bdf8, #0ea5e9);
        }
        .weather-gradient-cloudy {
            background: linear-gradient(to bottom right, #64748b, #334155);
        }
        .weather-gradient-rainy {
            background: linear-gradient(to bottom right, #1e3a8a, #3b82f6);
        }
        .weather-gradient-snowy {
            background: linear-gradient(to bottom right, #e2e8f0, #94a3b8);
        }
        .weather-gradient-stormy {
            background: linear-gradient(to bottom right, #312e81, #1e1b4b);
        }
        .radar-scan {
            position: relative;
            overflow: hidden;
        }
        .radar-scan::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, rgba(34, 197, 94, 0.3), transparent 90deg);
            transform: translate(-50%, -50%);
            animation: rotate 4s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        /* Staggered delays for up to 10 items */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.15s; }
        .delay-3 { animation-delay: 0.2s; }
        .delay-4 { animation-delay: 0.25s; }
        .delay-5 { animation-delay: 0.3s; }
        .delay-6 { animation-delay: 0.35s; }
        .delay-7 { animation-delay: 0.4s; }
        .delay-8 { animation-delay: 0.45s; }
        .delay-9 { animation-delay: 0.5s; }
        .delay-10 { animation-delay: 0.55s; }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
